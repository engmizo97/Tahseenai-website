<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile 3D Ring & Wave Tuner | Tahseen AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- lil-gui -->
  <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
  <style>
    :root {
      --bg: #070b16;
      --hero-bg: #0d1426;
      --teal: #008688;
      --teal-light: #00f5d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Zain', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* Top Floating Control Bar */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      right: 370px;
      height: 52px;
      background: rgba(13, 20, 38, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-pill {
      background: rgba(0, 134, 136, 0.25);
      border: 1px solid var(--teal);
      color: #5eead4;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .device-switcher {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .device-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .device-btn.active {
      background: var(--teal);
      color: #fff;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .btn-primary {
      background: var(--teal);
      border-color: #00a8aa;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 134, 136, 0.35);
    }

    .btn-primary:hover {
      background: #00a3a6;
      box-shadow: 0 0 25px rgba(0, 134, 136, 0.6);
    }

    /* Main Stage Workspace */
    .stage-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 75px 380px 20px 20px;
      position: relative;
    }

    /* Realistic Phone Bezel Frame */
    .phone-bezel {
      position: relative;
      background: #000;
      border: 11px solid #1e293b;
      border-radius: 50px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Dynamic Island Notch */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      z-index: 40;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Screen Inside Bezel */
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--hero-bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #phone-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Real-Time Mobile Header */
    .phone-header {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(13, 20, 38, 0.85);
      backdrop-filter: blur(12px);
    }

    .phone-logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .phone-logo span {
      color: var(--teal);
    }

    .phone-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .talk-btn {
      background: transparent;
      border: 1px solid var(--teal);
      color: #5eead4;
      padding: 3px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .burger-icon {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1px 0;
    }
    .burger-icon span {
      display: block;
      height: 2px;
      background: #e2e8f0;
      border-radius: 2px;
    }

    /* Phone Hero Text Overlay */
    .phone-hero-content {
      position: relative;
      z-index: 15;
      padding: 32px 18px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
    }

    .phone-hero-title {
      font-size: 32px;
      line-height: 1.12;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.85);
    }
    .phone-hero-title span {
      color: var(--teal);
    }

    .phone-hero-subtitle {
      font-size: 13px;
      line-height: 1.55;
      color: #cbd5e1;
      max-width: 280px;
      font-weight: 400;
    }

    .phone-hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      border: 1px solid var(--teal);
      background: rgba(0, 134, 136, 0.08);
      color: #5eead4;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(0, 134, 136, 0.25);
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #008688;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 134, 136, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Code Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.active {
      display: flex;
    }

    .modal-content {
      background: #0d1426;
      border: 1px solid rgba(0, 134, 136, 0.5);
      border-radius: 12px;
      width: 580px;
      max-width: 90vw;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 134, 136, 0.3);
    }

    .modal-header {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #cbd5e1;
      background: #070b16;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* lil-gui Custom Styling */
    .lil-gui {
      --background-color: rgba(13, 20, 38, 0.95);
      --text-color: #e2e8f0;
      --title-background-color: #080d1a;
      --widget-color: rgba(255, 255, 255, 0.08);
      --hover-color: rgba(0, 134, 136, 0.25);
      --focus-color: #008688;
      --number-color: #5eead4;
      --string-color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      border-radius: 10px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      top: 14px !important;
      right: 14px !important;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }

    .lil-gui .title {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #5eead4;
    }
  </style>
</head>
<body>

  <!-- Top Floating Controls -->
  <div class="top-bar">
    <div class="brand-title">
      <span>TAHSEEN &lt;AI&gt;</span>
      <span class="brand-pill">📱 PHONE 3D TUNER</span>
    </div>

    <div class="device-switcher">
      <button class="device-btn active" data-w="390" data-h="844" data-name="iPhone 14">iPhone 14</button>
      <button class="device-btn" data-w="375" data-h="667" data-name="iPhone SE">iPhone SE</button>
      <button class="device-btn" data-w="360" data-h="780" data-name="Galaxy S22">Galaxy S22</button>
      <button class="device-btn" data-w="412" data-h="915" data-name="Pixel 7">Pixel 7</button>
    </div>

    <div class="actions">
      <button class="btn-action" id="btnToggleLang" title="Switch English / Arabic mode">
        🌐 <span id="langLabel">AR Mode</span>
      </button>
      <button class="btn-action" id="btnToggleText" title="Show or hide overlay text">
        👁️ Toggle Text
      </button>
      <button class="btn-action" id="btnReset" title="Reset to current phone defaults">
        ↺ Reset
      </button>
      <button class="btn-action" id="btnViewCode" title="View formatted config code">
        &lt;/&gt; Code
      </button>
      <button class="btn-action btn-primary" id="btnCopyConfig" title="Copy config JSON directly to clipboard">
        📋 Copy Config
      </button>
    </div>
  </div>

  <!-- Stage Workspace Holding Phone Bezel -->
  <div class="stage-wrapper">
    <div class="phone-bezel" id="phoneBezel" style="width: 390px; height: 844px;">
      
      <!-- iPhone Dynamic Island -->
      <div class="dynamic-island"></div>

      <!-- Screen Container -->
      <div class="phone-screen" id="phoneScreen">
        
        <!-- WebGL Canvas Layer for Three.js -->
        <div id="phone-canvas"></div>

        <!-- Phone Mobile Top Navigation -->
        <header class="phone-header" id="phoneHeader">
          <div class="phone-logo">
            TAHSEEN <span>&lt;AI&gt;</span>
          </div>
          <div class="phone-header-actions">
            <span class="pill-btn" id="headerLangPill">EN</span>
            <span class="talk-btn" id="headerTalkBtn">TALK</span>
            <div class="burger-icon">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </header>

        <!-- Phone Hero Content Overlay -->
        <div class="phone-hero-content" id="phoneHeroContent">
          <h1 class="phone-hero-title" id="heroTitle">
            AI Solutions That <br />
            <span>Enhance</span> Your Work
          </h1>
          <p class="phone-hero-subtitle" id="heroSubtitle">
            We build AI agents and automations that save businesses time and reduce manual work.
          </p>
          <div class="phone-hero-cta" id="heroCta">
            <span id="heroCtaText">LET'S BUILD TOGETHER</span>
            <span id="heroCtaArrow">→</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">✓ Mobile Config copied to clipboard!</div>

  <!-- Code Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-content">
      <div class="modal-header">
        <span>📱 Mobile 3D Configuration</span>
        <button class="btn-action" id="btnCloseModal" style="padding: 2px 8px;">✕</button>
      </div>
      <div class="modal-body">
        <pre id="codeOutput"></pre>
      </div>
      <div class="modal-footer">
        <button class="btn-action btn-primary" id="btnModalCopy">📋 Copy Code</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Mobile Config Parameters ---
    const config = {
      // 📱 Ring Mobile Placement (User Tuned)
      ringMobilePosX: 1.1,
      ringMobilePosY: -0.05,
      ringMobilePosZ: 0.0,
      ringMobileScale: 0.44,
      ringMobileRotX: -0.59,
      ringMobileRotY: -0.66,
      ringMobileRotZ: -0.99,

      // 🌊 Wave Mobile Parameters (User Tuned)
      waveElevationY: -2.75,
      waveAmplitude: 0.68,
      waveArcHeight: 1.4,
      waveArcCenter: 0.1,
      waveSpeed: 0.6,
      gridWidth: 81,
      waveTwist: 0.8,
      strandSpread: 15,

      // 🕸️ Wireframe Lattice & Gridlines (Shown in screenshot)
      lineOpacity: 0.14,
      lineColor: '#00d2b4',
      transverseStep: 3,
      showLongitudinal: true,
      showTransverse: true,
      lineDiscardAlpha: 0.02,

      // ◀ Left & Right Edge Fades & Cliff Slope
      leftFadeStart: -0.10,
      leftFadeEnd: -0.10,
      leftFadePower: 1.95,
      fadeYDrop: 1.00,
      rightFadeStart: 0.20,
      rightFadeEnd: 1.00,
      rightFadePower: 1.50,

      // 📷 Mobile Camera
      cameraFOV: 46,
      cameraZ: 11.8,

      // ⚙️ Toggles
      mirrored: false,
      showText: true,
      showLattice: true,
      orbitMotion: true,
      preset: 'User Tuned Setup (Active)',
    };

    const DEFAULTS = JSON.parse(JSON.stringify(config));

    // Preset Configurations
    const presets = {
      'User Tuned Setup (Active)': {
        ringMobilePosX: 1.1,
        ringMobilePosY: -0.05,
        ringMobilePosZ: 0.0,
        ringMobileScale: 0.44,
        waveElevationY: -2.75,
        waveAmplitude: 0.68,
        waveArcHeight: 1.4,
        waveArcCenter: 0.1,
        cameraFOV: 46,
        cameraZ: 11.8,
        lineOpacity: 0.14,
        transverseStep: 3,
        lineDiscardAlpha: 0.02,
        fadeYDrop: 1.00,
      },
      'Smooth Edge (No Cliff Drop)': {
        ringMobilePosX: 1.1,
        ringMobilePosY: -0.05,
        ringMobilePosZ: 0.0,
        ringMobileScale: 0.44,
        waveElevationY: -2.75,
        waveAmplitude: 0.68,
        waveArcHeight: 1.4,
        waveArcCenter: 0.1,
        cameraFOV: 46,
        cameraZ: 11.8,
        lineOpacity: 0.14,
        transverseStep: 3,
        lineDiscardAlpha: 0.06,
        fadeYDrop: 0.15,
      },
      'Dense Topographic Wireframe': {
        ringMobilePosX: 1.1,
        ringMobilePosY: -0.05,
        ringMobilePosZ: 0.0,
        ringMobileScale: 0.44,
        waveElevationY: -2.75,
        waveAmplitude: 0.68,
        waveArcHeight: 1.4,
        waveArcCenter: 0.1,
        cameraFOV: 46,
        cameraZ: 11.8,
        lineOpacity: 0.22,
        transverseStep: 1,
        lineDiscardAlpha: 0.03,
        fadeYDrop: 0.70,
      },
      'Subtle Faint Lines': {
        ringMobilePosX: 1.1,
        ringMobilePosY: -0.05,
        ringMobilePosZ: 0.0,
        ringMobileScale: 0.44,
        waveElevationY: -2.75,
        waveAmplitude: 0.68,
        waveArcHeight: 1.4,
        waveArcCenter: 0.1,
        cameraFOV: 46,
        cameraZ: 11.8,
        lineOpacity: 0.08,
        transverseStep: 4,
        lineDiscardAlpha: 0.05,
        fadeYDrop: 0.40,
      }
    };

    // --- 2. Setup Three.js Scene Inside Phone Screen ---
    const phoneContainer = document.getElementById('phone-canvas');
    const phoneScreen = document.getElementById('phoneScreen');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1426);

    let screenW = phoneScreen.clientWidth || 390;
    let screenH = phoneScreen.clientHeight || 844;

    const camera = new THREE.PerspectiveCamera(config.cameraFOV, screenW / screenH, 0.1, 1000);
    camera.position.set(0, 0, config.cameraZ);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: true,
    });
    renderer.setSize(screenW, screenH);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    phoneContainer.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x020712, 1.2);
    scene.add(ambientLight);

    const textKeyLight = new THREE.PointLight(0x00f5d4, 15.0, 50, 1.1);
    textKeyLight.position.set(-6.0, -3.0, 1.2);
    scene.add(textKeyLight);

    const textDirLight = new THREE.DirectionalLight(0x38bdf8, 3.8);
    textDirLight.position.set(-6.0, -1.5, 1.5);
    scene.add(textDirLight);

    const rightRimLight = new THREE.PointLight(0x06b6d4, 8.5, 35);
    rightRimLight.position.set(6.0, 5.0, 2.0);
    scene.add(rightRimLight);

    const topHighlight = new THREE.DirectionalLight(0xe0ffff, 2.2);
    topHighlight.position.set(4.0, 8.0, 6.0);
    scene.add(topHighlight);

    // --- 3. Ring Group & Mesh Construction ---
    const heroGroup = new THREE.Group();
    heroGroup.position.set(config.ringMobilePosX, config.ringMobilePosY, config.ringMobilePosZ);
    heroGroup.scale.setScalar(config.ringMobileScale);
    heroGroup.rotation.set(config.ringMobileRotX, config.ringMobileRotY, config.ringMobileRotZ);
    scene.add(heroGroup);

    // Ring Materials
    const illuminatedMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x00f5d4,
      emissive: 0x003830,
      emissiveIntensity: 0.25,
      roughness: 0.11,
      metalness: 0.47,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      reflectivity: 0.95,
      side: THREE.DoubleSide,
    });

    const shadedMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x00d2b4,
      emissive: 0x002c25,
      emissiveIntensity: 0.18,
      roughness: 0.14,
      metalness: 0.48,
      clearcoat: 0.7,
      side: THREE.DoubleSide,
    });

    const sideCapMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x00f5d4,
      emissive: 0x008688,
      emissiveIntensity: 0.4,
      roughness: 0.12,
      metalness: 0.4,
      side: THREE.DoubleSide,
    });

    // Ring Lathe Geometry
    const innerR = 1.8;
    const outerR = 2.6;
    const ringDepth = 0.74;
    const halfDepth = ringDepth / 2;
    const bevel = 0.03;

    const profilePoints = [
      new THREE.Vector2(innerR, -halfDepth + bevel),
      new THREE.Vector2(innerR + bevel, -halfDepth),
      new THREE.Vector2(outerR - bevel, -halfDepth),
      new THREE.Vector2(outerR, -halfDepth + bevel),
      new THREE.Vector2(outerR, halfDepth - bevel),
      new THREE.Vector2(outerR - bevel, halfDepth),
      new THREE.Vector2(innerR + bevel, halfDepth),
      new THREE.Vector2(innerR, halfDepth - bevel),
      new THREE.Vector2(innerR, -halfDepth + bevel),
    ];

    const segments = 64;
    const gapAngle = 0.06;
    const arcLength = Math.PI - gapAngle;

    const topGeom = new THREE.LatheGeometry(profilePoints, segments, gapAngle / 2, arcLength);
    topGeom.computeVertexNormals();
    const topMesh = new THREE.Mesh(topGeom, shadedMaterial);
    topMesh.rotation.x = Math.PI / 2;
    topMesh.position.set(0, 0.025, 0);
    heroGroup.add(topMesh);

    const botGeom = new THREE.LatheGeometry(profilePoints, segments, Math.PI + gapAngle / 2, arcLength);
    botGeom.computeVertexNormals();
    const botMesh = new THREE.Mesh(botGeom, illuminatedMaterial);
    botMesh.rotation.x = Math.PI / 2;
    botMesh.position.set(0, 0.015, 0);
    heroGroup.add(botMesh);

    // End Caps
    const capWidth = outerR - innerR;
    const capHeight = ringDepth;
    const capGeom = new THREE.PlaneGeometry(capWidth, capHeight);
    const midR = (innerR + outerR) / 2;

    function createCutCap(angle) {
      const cap = new THREE.Mesh(capGeom, sideCapMaterial);
      cap.position.set(midR * Math.cos(angle), 0, midR * Math.sin(angle));
      cap.rotation.y = -angle + Math.PI / 2;
      return cap;
    }

    heroGroup.add(createCutCap(gapAngle / 2));
    heroGroup.add(createCutCap(Math.PI - gapAngle / 2));
    heroGroup.add(createCutCap(Math.PI + gapAngle / 2));
    heroGroup.add(createCutCap(2 * Math.PI - gapAngle / 2));

    // Internal Glow Ring
    const ringGlowGeom = new THREE.RingGeometry(innerR + 0.08, outerR - 0.08, 64);
    const glowUniforms = {
      pulseTime: { value: 0.0 },
      glowIntensity: { value: 0.4 },
    };
    const ringGlowShader = new THREE.ShaderMaterial({
      uniforms: glowUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float pulseTime;
        uniform float glowIntensity;
        void main() {
          float dist = distance(vUv, vec2(0.5));
          float alpha = smoothstep(0.5, 0.25, dist) * (0.85 + 0.15 * sin(pulseTime * 2.5)) * glowIntensity;
          gl_FragColor = vec4(0.0, 0.96, 0.83, alpha);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const ringGlowMesh = new THREE.Mesh(ringGlowGeom, ringGlowShader);
    ringGlowMesh.rotation.x = Math.PI / 2;
    heroGroup.add(ringGlowMesh);

    // --- 4. 43-Strand Streamline Ribbon Wave Geometry ---
    const numStrands = 43;
    const ptsPerStrand = 270;
    const totalPoints = numStrands * ptsPerStrand;

    let waveGeom = new THREE.BufferGeometry();
    let lineGeom = new THREE.BufferGeometry();
    let positions = new Float32Array(totalPoints * 3);
    let alphas = new Float32Array(totalPoints);
    let sizes = new Float32Array(totalPoints);

    function computeLeftFade(uNorm) {
      if (config.leftFadeEnd <= config.leftFadeStart) {
        return uNorm >= config.leftFadeEnd ? 1.0 : 0.0;
      }
      if (uNorm <= config.leftFadeStart) return 0.0;
      if (uNorm >= config.leftFadeEnd) return 1.0;
      const t = (uNorm - config.leftFadeStart) / (config.leftFadeEnd - config.leftFadeStart);
      const smooth = t * t * (3.0 - 2.0 * t);
      return Math.pow(Math.max(0.0, Math.min(1.0, smooth)), config.leftFadePower);
    }

    function computeRightFade(uNorm) {
      if (config.rightFadeEnd <= config.rightFadeStart) {
        return uNorm <= config.rightFadeStart ? 1.0 : 0.0;
      }
      if (uNorm <= config.rightFadeStart) return 1.0;
      if (uNorm >= config.rightFadeEnd) return 0.0;
      const t = (config.rightFadeEnd - uNorm) / (config.rightFadeEnd - config.rightFadeStart);
      const smooth = t * t * (3.0 - 2.0 * t);
      return Math.pow(Math.max(0.0, Math.min(1.0, smooth)), config.rightFadePower);
    }

    function getHorizontalFade(uNorm) {
      return uNorm < 0.0 ? computeLeftFade(uNorm) : computeRightFade(uNorm);
    }

    function pseudoRandom(seed) {
      const x = Math.sin(seed * 9999) * 10000;
      return x - Math.floor(x);
    }

    function rebuildWave() {
      let pIdx = 0;
      for (let s = 0; s < numStrands; s++) {
        const vNorm = (s / (numStrands - 1)) * 2.0 - 1.0;
        const strandZOffset = vNorm * (config.strandSpread * 0.5) - 3.8;

        for (let p = 0; p < ptsPerStrand; p++) {
          const uNorm = (p / (ptsPerStrand - 1)) * 2.0 - 1.0;
          const uZeroToOne = p / (ptsPerStrand - 1);

          const x = (config.mirrored ? -uNorm : uNorm) * (config.gridWidth * 0.5);
          const zCurve = Math.sin(uZeroToOne * Math.PI) * 2.8;
          const z = strandZOffset + zCurve;

          const fadeX = getHorizontalFade(uNorm);
          const fadeZ = Math.cos(vNorm * Math.PI * 0.5);
          const depthFade = Math.pow(Math.max(0.0, fadeZ), 0.5);
          const totalEdgeFade = fadeX * depthFade;

          const arcPhase = (x - (config.mirrored ? -config.waveArcCenter : config.waveArcCenter)) / 18.0;
          const risingArch = Math.exp(-arcPhase * arcPhase) * config.waveArcHeight;
          const undulatingWave = Math.sin(p * 0.08 + s * 0.22) * config.waveAmplitude + Math.cos(s * 0.16) * 0.45;
          const strandTwist = vNorm * config.waveTwist * Math.sin(uZeroToOne * Math.PI);
          const diagonalLift = (uNorm + 0.3) * 1.25;

          // fadeYDrop controls whether Y plunges to baseline (cliff) or stays floating (smooth alpha fade)
          const yMultiplier = 1.0 - (1.0 - totalEdgeFade) * config.fadeYDrop;
          const y = config.waveElevationY + (risingArch + undulatingWave + strandTwist + diagonalLift) * yMultiplier;

          positions[pIdx * 3] = x;
          positions[pIdx * 3 + 1] = y;
          positions[pIdx * 3 + 2] = z;

          const randVal = pseudoRandom(pIdx * 17 + s * 131 + p * 3);
          const isSparkle = randVal < 0.07;

          if (isSparkle) {
            alphas[pIdx] = totalEdgeFade * 0.90;
            sizes[pIdx] = Math.max(0.08, totalEdgeFade * 0.16 * 3.8);
          } else {
            alphas[pIdx] = totalEdgeFade * 0.85;
            sizes[pIdx] = Math.max(0.02, totalEdgeFade * 0.16);
          }
          pIdx++;
        }
      }

      waveGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      waveGeom.setAttribute("alpha", new THREE.BufferAttribute(alphas, 1));
      waveGeom.setAttribute("size", new THREE.BufferAttribute(sizes, 1));
      waveGeom.attributes.position.needsUpdate = true;
      waveGeom.attributes.alpha.needsUpdate = true;
      waveGeom.attributes.size.needsUpdate = true;

      rebuildLines();
    }

    function rebuildLines() {
      const lineIndices = [];
      if (config.showLongitudinal) {
        for (let s = 0; s < numStrands; s++) {
          for (let p = 0; p < ptsPerStrand - 1; p++) {
            lineIndices.push(s * ptsPerStrand + p, s * ptsPerStrand + p + 1);
          }
        }
      }
      if (config.showTransverse) {
        const step = Math.max(1, Math.round(config.transverseStep));
        for (let s = 0; s < numStrands - 1; s++) {
          for (let p = 0; p < ptsPerStrand; p += step) {
            lineIndices.push(s * ptsPerStrand + p, (s + 1) * ptsPerStrand + p);
          }
        }
      }

      lineGeom.setAttribute("position", waveGeom.getAttribute("position"));
      lineGeom.setAttribute("alpha", waveGeom.getAttribute("alpha"));
      lineGeom.setIndex(lineIndices);
      lineGeom.attributes.position.needsUpdate = true;
      lineGeom.attributes.alpha.needsUpdate = true;
    }

    // Particle Texture
    const pCanvas = document.createElement("canvas");
    pCanvas.width = 128;
    pCanvas.height = 128;
    const pCtx = pCanvas.getContext("2d");
    const pGrad = pCtx.createRadialGradient(64, 64, 0, 64, 64, 60);
    pGrad.addColorStop(0.00, "rgba(255, 255, 255, 1.0)");
    pGrad.addColorStop(0.18, "rgba(0, 245, 212, 1.0)");
    pGrad.addColorStop(0.42, "rgba(0, 180, 216, 0.85)");
    pGrad.addColorStop(0.70, "rgba(0, 134, 136, 0.35)");
    pGrad.addColorStop(1.00, "rgba(0, 0, 0, 0.0)");
    pCtx.fillStyle = pGrad;
    pCtx.fillRect(0, 0, 128, 128);
    const pTexture = new THREE.CanvasTexture(pCanvas);

    const waveShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        pointTexture: { value: pTexture },
        uTime: { value: 0.0 },
        uWaveSpeed: { value: config.waveSpeed },
      },
      vertexShader: `
        attribute float alpha;
        attribute float size;
        varying float vAlpha;
        uniform float uTime;
        uniform float uWaveSpeed;
        
        void main() {
          vAlpha = alpha;
          vec3 pos = position;
          
          float wave = sin(pos.x * 0.18 + uTime * uWaveSpeed * 1.5) * 
                       cos(pos.z * 0.22 + uTime * uWaveSpeed * 1.0) * 0.42;
          pos.y += wave * (0.25 + alpha * 0.75);
          
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = size * (320.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform sampler2D pointTexture;
        varying float vAlpha;
        void main() {
          vec4 texColor = texture2D(pointTexture, gl_PointCoord);
          gl_FragColor = vec4(texColor.rgb, texColor.a * vAlpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const wavePoints = new THREE.Points(waveGeom, waveShaderMaterial);
    scene.add(wavePoints);

    // Synchronized Wireframe Lattice Line Segments
    const lineShaderMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 },
        uWaveSpeed: { value: config.waveSpeed },
        uLineColor: { value: new THREE.Color(config.lineColor) },
        uLineOpacity: { value: config.lineOpacity },
        uLineDiscardAlpha: { value: config.lineDiscardAlpha },
      },
      vertexShader: `
        attribute float alpha;
        varying float vAlpha;
        uniform float uTime;
        uniform float uWaveSpeed;
        
        void main() {
          vAlpha = alpha;
          vec3 pos = position;
          float wave = sin(pos.x * 0.22 + uTime * uWaveSpeed * 1.1 + pos.z * 0.14) * 0.38 +
                       cos(pos.z * 0.20 + uTime * uWaveSpeed * 0.85) * 0.25;
          pos.y += wave * (0.25 + alpha * 0.75);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uLineColor;
        uniform float uLineOpacity;
        uniform float uLineDiscardAlpha;
        varying float vAlpha;
        void main() {
          if (vAlpha < uLineDiscardAlpha) discard;
          gl_FragColor = vec4(uLineColor, vAlpha * uLineOpacity);
        }
      `,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const waveLineMesh = new THREE.LineSegments(lineGeom, lineShaderMaterial);
    scene.add(waveLineMesh);

    rebuildWave();

    // --- 5. Animation Loop ---
    let animationFrameId;
    const clock = new THREE.Clock();

    function animate() {
      animationFrameId = requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      waveShaderMaterial.uniforms.uTime.value = elapsedTime;
      waveShaderMaterial.uniforms.uWaveSpeed.value = config.waveSpeed;

      lineShaderMaterial.uniforms.uTime.value = elapsedTime;
      lineShaderMaterial.uniforms.uWaveSpeed.value = config.waveSpeed;
      lineShaderMaterial.uniforms.uLineOpacity.value = config.lineOpacity;
      lineShaderMaterial.uniforms.uLineColor.value.set(config.lineColor);
      lineShaderMaterial.uniforms.uLineDiscardAlpha.value = config.lineDiscardAlpha;

      glowUniforms.pulseTime.value = elapsedTime * 1.2;

      // In-Place Smooth Orbital Motion
      if (config.orbitMotion) {
        const orbitSpeed = 1.15;
        const angle = elapsedTime * orbitSpeed;
        const circleX = Math.cos(angle) * 0.12;
        const circleY = Math.sin(angle) * 0.15;
        const tiltX = Math.sin(angle) * 0.03;
        const tiltY = Math.cos(angle) * 0.03;

        const targetX = (config.mirrored ? -config.ringMobilePosX : config.ringMobilePosX) + circleX;
        const targetY = config.ringMobilePosY + circleY;
        const targetZ = config.ringMobilePosZ;

        heroGroup.position.x += (targetX - heroGroup.position.x) * 0.08;
        heroGroup.position.y += (targetY - heroGroup.position.y) * 0.08;
        heroGroup.position.z += (targetZ - heroGroup.position.z) * 0.08;

        heroGroup.rotation.x = config.ringMobileRotX + tiltX;
        heroGroup.rotation.y = config.ringMobileRotY * (config.mirrored ? -1 : 1) + tiltY;
        heroGroup.rotation.z = config.ringMobileRotZ * (config.mirrored ? -1 : 1);
      } else {
        heroGroup.position.set(
          config.mirrored ? -config.ringMobilePosX : config.ringMobilePosX,
          config.ringMobilePosY,
          config.ringMobilePosZ
        );
        heroGroup.rotation.set(
          config.ringMobileRotX,
          config.ringMobileRotY * (config.mirrored ? -1 : 1),
          config.ringMobileRotZ * (config.mirrored ? -1 : 1)
        );
      }

      heroGroup.scale.setScalar(config.ringMobileScale);

      camera.fov = config.cameraFOV;
      camera.position.z = config.cameraZ;
      camera.updateProjectionMatrix();

      waveLineMesh.visible = config.showLattice;

      renderer.render(scene, camera);
    }

    animate();

    // --- 6. Resize Handler ---
    function updatePhoneDimensions(w, h) {
      const bezel = document.getElementById('phoneBezel');
      bezel.style.width = `${w}px`;
      bezel.style.height = `${h}px`;

      setTimeout(() => {
        screenW = phoneScreen.clientWidth;
        screenH = phoneScreen.clientHeight;
        camera.aspect = screenW / screenH;
        camera.updateProjectionMatrix();
        renderer.setSize(screenW, screenH);
      }, 50);
    }

    // --- 7. lil-gui Controller Setup ---
    const gui = new lil.GUI({ title: '📱 Mobile 3D Tuner', width: 330 });

    // Presets Folder
    const presetFolder = gui.addFolder('🎯 Presets');
    presetFolder.add(config, 'preset', Object.keys(presets)).name('Preset').onChange((name) => {
      const p = presets[name];
      if (p) {
        Object.assign(config, p);
        rebuildWave();
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    });

    // Ring Placement Folder
    const ringFolder = gui.addFolder('💍 Ring Mobile Position & Scale');
    ringFolder.add(config, 'ringMobilePosX', -3.5, 3.5, 0.05).name('Position X (H)').listen();
    ringFolder.add(config, 'ringMobilePosY', -4.0, 2.5, 0.05).name('Position Y (V)').listen();
    ringFolder.add(config, 'ringMobilePosZ', -5.0, 5.0, 0.1).name('Position Z (Depth)').listen();
    ringFolder.add(config, 'ringMobileScale', 0.15, 1.20, 0.01).name('Scale').listen();
    ringFolder.add(config, 'ringMobileRotX', -Math.PI, Math.PI, 0.02).name('Rotation X').listen();
    ringFolder.add(config, 'ringMobileRotY', -Math.PI, Math.PI, 0.02).name('Rotation Y').listen();
    ringFolder.add(config, 'ringMobileRotZ', -Math.PI, Math.PI, 0.02).name('Rotation Z').listen();
    ringFolder.open();

    // Wave Placement Folder
    const waveFolder = gui.addFolder('🌊 Wave Mobile Dynamics');
    waveFolder.add(config, 'waveElevationY', -6.0, 2.0, 0.05).name('Elevation Y').onChange(rebuildWave).listen();
    waveFolder.add(config, 'waveAmplitude', 0.0, 2.0, 0.02).name('Amplitude').onChange(rebuildWave).listen();
    waveFolder.add(config, 'waveArcHeight', 0.0, 3.5, 0.05).name('Arc Height').onChange(rebuildWave).listen();
    waveFolder.add(config, 'waveArcCenter', -5.0, 5.0, 0.1).name('Arc Center').onChange(rebuildWave).listen();
    waveFolder.add(config, 'waveSpeed', 0.0, 2.0, 0.05).name('Wave Speed').listen();
    waveFolder.add(config, 'strandSpread', 5, 30, 1).name('Strand Spread').onChange(rebuildWave).listen();
    waveFolder.add(config, 'gridWidth', 30, 140, 1).name('Grid Width').onChange(rebuildWave).listen();
    waveFolder.open();

    // Wireframe Lattice & Gridlines Folder (Requested by user)
    const latticeFolder = gui.addFolder('🕸️ Lattice Wireframe Lines');
    latticeFolder.add(config, 'lineOpacity', 0.0, 0.8, 0.01).name('Line Opacity').listen();
    latticeFolder.addColor(config, 'lineColor').name('Line Color').listen();
    latticeFolder.add(config, 'transverseStep', 1, 10, 1).name('Grid Spacing Step').onChange(rebuildLines).listen();
    latticeFolder.add(config, 'lineDiscardAlpha', 0.00, 0.25, 0.01).name('Edge Cutoff Alpha').listen();
    latticeFolder.add(config, 'showLongitudinal').name('Strand Lines').onChange(rebuildLines);
    latticeFolder.add(config, 'showTransverse').name('Cross Gridlines').onChange(rebuildLines);
    latticeFolder.open();

    // Edge Fade & Cliff Slope Folder (Requested by user)
    const fadeFolder = gui.addFolder('◀ Edge Fade & Cliff Slope');
    fadeFolder.add(config, 'fadeYDrop', 0.0, 1.0, 0.05).name('Edge Cliff Drop (Y)').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'leftFadeStart', -1.0, 0.5, 0.02).name('Left Fade Start').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'leftFadeEnd', -0.8, 0.8, 0.02).name('Left Fade End').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'leftFadePower', 0.2, 4.0, 0.05).name('Left Fade Curve').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'rightFadeStart', -0.2, 0.8, 0.02).name('Right Fade Start').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'rightFadeEnd', 0.3, 1.0, 0.02).name('Right Fade End').onChange(rebuildWave).listen();
    fadeFolder.add(config, 'rightFadePower', 0.2, 4.0, 0.05).name('Right Fade Curve').onChange(rebuildWave).listen();
    fadeFolder.open();

    // Camera Folder
    const camFolder = gui.addFolder('📷 Camera Settings');
    camFolder.add(config, 'cameraFOV', 30, 75, 1).name('Camera FOV').listen();
    camFolder.add(config, 'cameraZ', 6.0, 22.0, 0.2).name('Camera Z Distance').listen();

    // Toggles Folder
    const togglesFolder = gui.addFolder('⚙️ Viewport & Toggles');
    togglesFolder.add(config, 'showText').name('Show Text Overlay').onChange((show) => {
      document.getElementById('phoneHeroContent').style.display = show ? 'flex' : 'none';
    });
    togglesFolder.add(config, 'showLattice').name('Show Lattice Wireframe');
    togglesFolder.add(config, 'orbitMotion').name('In-Place Orbit Motion');
    togglesFolder.add(config, 'mirrored').name('Arabic RTL Mirror').onChange(rebuildWave);

    // --- 8. UI Handlers & Interactivity ---

    // Device switcher buttons
    document.querySelectorAll('.device-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const w = parseInt(btn.getAttribute('data-w'), 10);
        const h = parseInt(btn.getAttribute('data-h'), 10);
        updatePhoneDimensions(w, h);
      });
    });

    // Language Toggle (English / Arabic)
    const btnToggleLang = document.getElementById('btnToggleLang');
    const langLabel = document.getElementById('langLabel');
    const heroTitle = document.getElementById('heroTitle');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const heroCtaText = document.getElementById('heroCtaText');
    const heroCtaArrow = document.getElementById('heroCtaArrow');
    const headerLangPill = document.getElementById('headerLangPill');
    const headerTalkBtn = document.getElementById('headerTalkBtn');
    const phoneScreenEl = document.getElementById('phoneScreen');

    btnToggleLang.addEventListener('click', () => {
      config.mirrored = !config.mirrored;
      rebuildWave();
      gui.controllersRecursive().forEach(c => c.updateDisplay());

      if (config.mirrored) {
        langLabel.innerText = "EN Mode";
        headerLangPill.innerText = "عربي";
        headerTalkBtn.innerText = "تواصل";
        phoneScreenEl.setAttribute('dir', 'rtl');
        heroTitle.innerHTML = 'حلول ذكاء اصطناعي <br /><span>تُعزز</span> وتطوّر أعمالك';
        heroSubtitle.innerText = 'نبني وكلاء ذكاء اصطناعي وأنظمة أتمتة تساعد الشركات على إنجاز أعمالها اليومية بسرعة ودقة.';
        heroCtaText.innerText = 'لنبنِ معاً';
        heroCtaArrow.innerText = '←';
      } else {
        langLabel.innerText = "AR Mode";
        headerLangPill.innerText = "EN";
        headerTalkBtn.innerText = "TALK";
        phoneScreenEl.setAttribute('dir', 'ltr');
        heroTitle.innerHTML = 'AI Solutions That <br /><span>Enhance</span> Your Work';
        heroSubtitle.innerText = 'We build AI agents and automations that save businesses time and reduce manual work.';
        heroCtaText.innerText = "LET'S BUILD TOGETHER";
        heroCtaArrow.innerText = '→';
      }
    });

    // Toggle Text Overlay
    document.getElementById('btnToggleText').addEventListener('click', () => {
      config.showText = !config.showText;
      document.getElementById('phoneHeroContent').style.display = config.showText ? 'flex' : 'none';
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });

    // Reset Defaults
    document.getElementById('btnReset').addEventListener('click', () => {
      Object.assign(config, JSON.parse(JSON.stringify(DEFAULTS)));
      rebuildWave();
      gui.controllersRecursive().forEach(c => c.updateDisplay());
      showToast("↺ Reset to initial phone defaults");
    });

    // Toast Function
    function showToast(msg = "✓ Mobile Config copied to clipboard!") {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // Get Clean JSON Output
    function getCleanConfig() {
      return {
        ringMobilePosX: Number(config.ringMobilePosX.toFixed(2)),
        ringMobilePosY: Number(config.ringMobilePosY.toFixed(2)),
        ringMobilePosZ: Number(config.ringMobilePosZ.toFixed(2)),
        ringMobileScale: Number(config.ringMobileScale.toFixed(2)),
        ringMobileRotX: Number(config.ringMobileRotX.toFixed(2)),
        ringMobileRotY: Number(config.ringMobileRotY.toFixed(2)),
        ringMobileRotZ: Number(config.ringMobileRotZ.toFixed(2)),
        waveElevationY: Number(config.waveElevationY.toFixed(2)),
        waveAmplitude: Number(config.waveAmplitude.toFixed(2)),
        waveArcHeight: Number(config.waveArcHeight.toFixed(2)),
        waveArcCenter: Number(config.waveArcCenter.toFixed(2)),
        waveSpeed: Number(config.waveSpeed.toFixed(2)),
        lineOpacity: Number(config.lineOpacity.toFixed(2)),
        lineColor: config.lineColor,
        transverseStep: Number(config.transverseStep),
        lineDiscardAlpha: Number(config.lineDiscardAlpha.toFixed(2)),
        fadeYDrop: Number(config.fadeYDrop.toFixed(2)),
        leftFadeStart: Number(config.leftFadeStart.toFixed(2)),
        leftFadeEnd: Number(config.leftFadeEnd.toFixed(2)),
        cameraFOV: Number(config.cameraFOV),
        cameraZ: Number(config.cameraZ.toFixed(1)),
      };
    }

    // Copy to Clipboard
    async function copyToClipboard() {
      const jsonStr = JSON.stringify(getCleanConfig(), null, 2);
      try {
        await navigator.clipboard.writeText(jsonStr);
        showToast("📋 Mobile Config copied to clipboard!");
      } catch (err) {
        showToast("✓ Config ready: " + jsonStr.substring(0, 40) + "...");
      }
    }

    document.getElementById('btnCopyConfig').addEventListener('click', copyToClipboard);

    // Code Modal
    const modalBackdrop = document.getElementById('modalBackdrop');
    const codeOutput = document.getElementById('codeOutput');

    document.getElementById('btnViewCode').addEventListener('click', () => {
      const clean = getCleanConfig();
      codeOutput.innerText = JSON.stringify(clean, null, 2);
      modalBackdrop.classList.add('active');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      modalBackdrop.classList.remove('active');
    });

    document.getElementById('btnModalCopy').addEventListener('click', () => {
      copyToClipboard();
      modalBackdrop.classList.remove('active');
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove('active');
    });
  </script>
</body>
</html>
